# Docker Compose pour la base de données de test E2E
#
# Usage:
#   docker-compose -f docker-compose.test.yml up -d   # Démarrer
#   docker-compose -f docker-compose.test.yml down    # Arrêter
#   docker-compose -f docker-compose.test.yml down -v # Arrêter + supprimer données
#
# La base sera accessible sur localhost:5433 (pas 5432 pour éviter les conflits)

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: encave-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: encave_test
    ports:
      - '5433:5432' # Port 5433 en local -> 5432 dans le container
    volumes:
      - encave_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  encave_test_data:
