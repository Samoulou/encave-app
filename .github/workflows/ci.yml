name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI is hermetic: no job talks to a real database (the DB-invariant tests
# skip without INVARIANTS_DATABASE_URL), so a well-formed placeholder is all
# the Zod env validation needs. The old secrets.DATABASE_URL resolved to an
# empty string when unset and failed every test job.
env:
  DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/encave'
  # next build runs with NODE_ENV=production, where env.ts requires this.
  # A fixed placeholder, not a secret — nothing in CI signs real sessions.
  BETTER_AUTH_SECRET: 'ci-placeholder-not-a-secret-0123456789abcdef'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Check formatting
        run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/encave'
          # No reachable database in CI — the prebuild migrate deploy must
          # not run here (it runs for real on every Vercel deployment).
          SKIP_DB_MIGRATIONS: '1'
