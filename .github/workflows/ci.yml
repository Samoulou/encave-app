name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# One run per ref: a force-push or rapid follow-up commit cancels the
# superseded run instead of stacking e2e/Lighthouse jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI is hermetic: no job talks to a real database (the DB-invariant tests
# skip without INVARIANTS_DATABASE_URL), so a well-formed placeholder is all
# the Zod env validation needs. The old secrets.DATABASE_URL resolved to an
# empty string when unset and failed every test job.
env:
  DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/encave'
  # next build runs with NODE_ENV=production, where env.ts requires this.
  # A fixed placeholder, not a secret — nothing in CI signs real sessions.
  BETTER_AUTH_SECRET: 'ci-placeholder-not-a-secret-0123456789abcdef'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Check formatting
        run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm run test:run

  db-invariants:
    name: DB Invariants
    runs-on: ubuntu-latest

    # The tests/db suites (money invariants, hold/scan/gift concurrency) are
    # skipped without INVARIANTS_DATABASE_URL — this job is the only place
    # they run against a real Postgres (P-16 / L-180).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: encave
          POSTGRES_PASSWORD: encave
          POSTGRES_DB: encave_invariants
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U encave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: 'postgresql://encave:encave@localhost:5432/encave_invariants'
          DIRECT_URL: 'postgresql://encave:encave@localhost:5432/encave_invariants'

      - name: Run DB invariant & concurrency tests
        run: npm run test:db:invariants
        env:
          INVARIANTS_DATABASE_URL: 'postgresql://encave:encave@localhost:5432/encave_invariants'
          DIRECT_URL: 'postgresql://encave:encave@localhost:5432/encave_invariants'

  e2e:
    name: E2E (6 launch journeys + a11y)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    # Hermetic: .env.test.example works verbatim (placeholder Stripe keys,
    # synthetic signed webhooks) — the service is mapped to 5433 to match it.
    # Job-level env REQUIRED: dotenv -e .env.test does NOT override an
    # already-set variable, and the workflow-level placeholder DATABASE_URL
    # would otherwise win over .env.test (first CI run failure).
    env:
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5433/encave_test'
      DIRECT_URL: 'postgresql://postgres:postgres@localhost:5433/encave_test'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: encave_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Create test env file
        run: cp .env.test.example .env.test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # prebuild migrates the service DB; the build's static pages then
      # query it. Same URL the tests use (job env).
      - name: Build application
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse (local build, budgets blocking)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    # PR stage of L-182: scores are WARN-only against the local build (the
    # Lantern mobile simulation is a documented artifact on this app);
    # resource budgets are blocking. The >= 95 gate runs against staging
    # (weekly-gates.yml + push on dev).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: encave
          POSTGRES_PASSWORD: encave
          POSTGRES_DB: encave_lhci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U encave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: 'postgresql://encave:encave@localhost:5432/encave_lhci'
      DIRECT_URL: 'postgresql://encave:encave@localhost:5432/encave_lhci'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Seed discovery pages
        run: npx tsx tests/e2e/scripts/setup-test-db.ts

      - name: Run Lighthouse CI
        run: npx lhci autorun --config=lighthouserc.local.cjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    # The homepage is statically generated at build time and queries the
    # database, so the build needs a real (empty) Postgres. The prebuild
    # applies the full migration history to it — every PR to main thereby
    # also validates a virgin-database migrate deploy.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: encave
          POSTGRES_PASSWORD: encave
          POSTGRES_DB: encave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U encave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: 'postgresql://encave:encave@localhost:5432/encave'
          DIRECT_URL: 'postgresql://encave:encave@localhost:5432/encave'
