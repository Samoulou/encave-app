name: DB Migrate (ad hoc)

# Applies `prisma migrate deploy` to an arbitrary Postgres database.
# Manual dispatch only. Preferred: set the ADHOC_DATABASE_URL repo secret
# and leave the input empty — dispatch inputs are persisted with the run,
# secrets are not. The input remains available for one-offs (masked from
# the logs, never committed). Pooler or direct Neon URL both work — the
# pooler suffix is stripped automatically for DIRECT_URL, which Prisma
# Migrate uses.
#
# The optional seed WIPES EVERY TABLE (gift-card ledger included). It is
# fenced by four independent guards — all must pass:
#   1. `seed` = yes-wipe-and-seed AND `seed_confirm` = the typed phrase
#      `wipe-and-reseed` (a dropdown alone is one mis-click away);
#   2. the target URL is pasted explicitly (never the ambient secret);
#   3. the target host is on the allow-list `SEED_ALLOWED_DB_HOSTS`
#      (repository VARIABLE, comma-separated hosts of disposable dev/preview
#      databases). Unset or empty = seeding is impossible. A Neon host does
#      not carry the branch name, so only an allow-list can tell a
#      throwaway branch from production;
#   4. nothing in the host / database name contains "prod", and the host is
#      not the one declared in the `PRODUCTION_DB_HOST` variable.
# Migrations alone (seed = no) stay allowed on any database, production
# included — they are additive.

on:
  workflow_dispatch:
    inputs:
      database_url:
        description: 'Postgres connection string — leave EMPTY to use the ADHOC_DATABASE_URL secret (preferred)'
        required: false
        default: ''
        type: string
      confirm:
        description: "Type 'migrate-deploy' to confirm"
        required: true
        type: string
      seed:
        description: 'DESTRUCTIVE — wipes tables then reseeds. Requires an explicit database_url input (never runs against the secret). Never production.'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes-wipe-and-seed'
      seed_confirm:
        description: "Only when seeding: type 'wipe-and-reseed' to confirm the wipe. Leave empty otherwise."
        required: false
        default: ''
        type: string

jobs:
  migrate:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate confirmation phrase
        if: ${{ inputs.confirm != 'migrate-deploy' }}
        run: |
          echo "Confirmation phrase mismatch — aborting."
          exit 1

      # A wipe must name its target: seeding never runs against the ambient
      # ADHOC_DATABASE_URL secret, only against an explicitly pasted URL.
      - name: Validate seed target is explicit
        if: ${{ inputs.seed == 'yes-wipe-and-seed' && inputs.database_url == '' }}
        run: |
          echo "Refusing to seed: yes-wipe-and-seed requires pasting the target database_url explicitly."
          exit 1

      - name: Validate seed confirmation phrase
        if: ${{ inputs.seed == 'yes-wipe-and-seed' && inputs.seed_confirm != 'wipe-and-reseed' }}
        run: |
          echo "Refusing to seed: type 'wipe-and-reseed' in seed_confirm to confirm the wipe."
          exit 1

      # Runs BEFORE anything touches the database. The URL only travels
      # through env (never interpolated into the script) and only the verdict
      # is printed — never the host of a refused target.
      - name: Refuse to seed a production-looking or unlisted database
        if: ${{ inputs.seed == 'yes-wipe-and-seed' }}
        env:
          INPUT_URL: ${{ inputs.database_url }}
          SEED_ALLOWED_DB_HOSTS: ${{ vars.SEED_ALLOWED_DB_HOSTS }}
          PRODUCTION_DB_HOST: ${{ vars.PRODUCTION_DB_HOST }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          from urllib.parse import urlparse

          def normalize(host):
              # Neon: the pooled and the direct endpoint are the same database.
              return (host or "").strip().lower().replace("-pooler.", ".")

          try:
              parsed = urlparse(os.environ.get("INPUT_URL", "").strip())
          except ValueError:
              sys.exit("Refusing to seed: database_url is not a parseable URL.")

          host = normalize(parsed.hostname)
          database = (parsed.path or "").lstrip("/").lower()
          if not host:
              sys.exit("Refusing to seed: database_url has no host.")

          if "prod" in host or "prod" in database:
              sys.exit("Refusing to seed: the target host or database name contains 'prod'.")

          production = normalize(os.environ.get("PRODUCTION_DB_HOST"))
          if production and host == production:
              sys.exit("Refusing to seed: the target is the declared PRODUCTION_DB_HOST.")

          allowed = {
              normalize(entry)
              for entry in os.environ.get("SEED_ALLOWED_DB_HOSTS", "").split(",")
              if entry.strip()
          }
          if not allowed:
              sys.exit(
                  "Refusing to seed: the SEED_ALLOWED_DB_HOSTS repository variable is empty. "
                  "List the hosts of the disposable dev/preview databases there first."
              )
          if host not in allowed:
              sys.exit(
                  "Refusing to seed: the target host is not on the SEED_ALLOWED_DB_HOSTS allow-list."
              )

          print("Seed target accepted: host is on the allow-list.")
          PY

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare connection strings (masked)
        env:
          INPUT_URL: ${{ inputs.database_url }}
          SECRET_URL: ${{ secrets.ADHOC_DATABASE_URL }}
        run: |
          RAW_URL="${INPUT_URL:-$SECRET_URL}"
          if [ -z "$RAW_URL" ]; then
            echo "No connection string: set the ADHOC_DATABASE_URL repo secret (preferred) or fill the database_url input."
            exit 1
          fi
          case "$RAW_URL" in *$'\n'*)
            echo "Connection string must be a single line." ; exit 1 ;;
          esac
          echo "::add-mask::$RAW_URL"
          # Drop channel_binding (libpq-only param) whatever its position.
          CLEAN=$(printf '%s' "$RAW_URL" | sed -E 's/([?&])channel_binding=[^&]*&/\1/; s/[?&]channel_binding=[^&]*$//')
          # Neon: migrations must hit the direct endpoint, not PgBouncer.
          DIRECT=$(printf '%s' "$CLEAN" | sed 's/-pooler\./\./')
          echo "::add-mask::$CLEAN"
          echo "::add-mask::$DIRECT"
          {
            printf 'DATABASE_URL<<__ENV_EOF__\n%s\n__ENV_EOF__\n' "$CLEAN"
            printf 'DIRECT_URL<<__ENV_EOF__\n%s\n__ENV_EOF__\n' "$DIRECT"
          } >> "$GITHUB_ENV"

      - name: Apply migrations
        run: npx --yes prisma@5.22.0 migrate deploy

      - name: Migration status
        run: npx --yes prisma@5.22.0 migrate status

      - name: Install dependencies (seed only)
        if: ${{ inputs.seed == 'yes-wipe-and-seed' }}
        run: npm ci

      - name: Seed database (wipes existing data)
        if: ${{ inputs.seed == 'yes-wipe-and-seed' }}
        env:
          SEED_ALLOW_DESTRUCTIVE: '1'
        run: npx prisma db seed
